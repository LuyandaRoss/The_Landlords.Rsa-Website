    <meta charset="UTF-8">

<body>

    <header>

        <h1>The_LandLords.Rsa</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="shop.html">Shop</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>

        <hr>

    </header>

    <main>

        <section>

            <h2>Product Enquiry Form</h2>

            <p>
                Complete the form below and we will contact you regarding
                your selected product.
            </p>

        </section>

        <hr>

        <section>

            <form>

                <fieldset>

                    <legend>Customer Information</legend>

                    <label for="fullname">Full Name:</label>
                    <br>
                    <input type="text" id="fullname" name="fullname" required>
                    <br><br>

                    <label for="email">Email Address:</label>
                    <br>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="phone">Phone Number:</label>
                    <br>
                    <input type="tel" id="phone" name="phone">
                    <br><br>

                </fieldset>

                <br>

                <fieldset>

                    <legend>Product Details</legend>

                    <label for="collection">Collection:</label>
                    <br>

                    <select id="collection" name="collection">

                        <option>Mansion Affairs</option>
                        <option>Golden Resort</option>
                        <option>Angel Kind</option>
                        <option>Love Hoops Dreams</option>

                    </select>

                    <br><br>

                    <label for="product">Product Type:</label>
                    <br>

                    <select id="product" name="product">

                        <option>Hoodie</option>
                        <option>T-Shirt</option>
                        <option>Crop Top</option>
                        <option>Jacket</option>

                    </select>

                    <br><br>

                    <label for="size">Size:</label>
                    <br>

                    <select id="size" name="size">

                        <option>Small</option>
                        <option>Medium</option>
                        <option>Large</option>
                        <option>XL</option>
                        <option>XXL</option>

                    </select>

                    <br><br>

                    <label for="quantity">Quantity:</label>
                    <br>

                    <input type="number"
                           id="quantity"
                           name="quantity"
                           min="1">

                </fieldset>

                <br>

                <fieldset>

                    <legend>Additional Information</legend>

                    <label for="message">Message:</label>
                    <br>

                    <textarea id="message"
                              name="message"
                              rows="6"
                              cols="50"></textarea>

                </fieldset>

                <br>

                <input type="submit" value="Submit Enquiry">
                <input type="reset" value="Clear Form">

            </form>

        </section>

    </main>

    <hr>

        <p>RENT IS DUE</p>

    </footer>

</body>

</html>
